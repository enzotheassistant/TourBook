name: CI

on:
  push:
    branches: [main, claude/upbeat-wright-6nkyfq]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches package.json's engines.node and the Node.js Version
          # already configured on this project's live Vercel deployment
          # (confirmed via the Vercel API: nodeVersion "24.x", latest
          # deployment READY on it). Node 20 -- this repo's engines field
          # until this change, and this workflow's node-version before it --
          # doesn't support --experimental-strip-types at all, which
          # test:unit relies on; that was caught by a real CI failure
          # ("node: bad option: --experimental-strip-types" on Node
          # 20.20.2) the first time this workflow actually ran.
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build
